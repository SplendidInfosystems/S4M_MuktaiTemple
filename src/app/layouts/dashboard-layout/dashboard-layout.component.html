<div class="flex h-screen bg-gray-50 overflow-hidden">
  <app-sidebar
    *ngIf="role === 'admin'"
    [sidebarOpen]="sidebarOpen"
    [screenIsSmall]="screenIsSmall"
    (close)="closeSidebar()">
  </app-sidebar>

  <!-- PRESIDENT SIDEBAR -->
  <app-president-sidebar
    *ngIf="role === 'president'"
    [sidebarOpen]="sidebarOpen"
    [screenIsSmall]="screenIsSmall"
    (close)="closeSidebar()">
  </app-president-sidebar>

  <!-- MAIN AREA -->
  <div class="flex-1 flex flex-col overflow-hidden">

   <!-- DESKTOP HEADER (ADMIN ONLY) -->
<div *ngIf="role === 'admin'" class="hidden md:block bg-white border-b">
  <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">

    <h1 class="text-3xl font-bold text-orange-600">
      Admin Dashboard
    </h1>

    <!-- Temple Dropdown -->
    <div class="relative flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg"
           class="w-5 h-5 text-gray-600"
           fill="none" stroke="currentColor" stroke-width="2"
           viewBox="0 0 24 24">
        <path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z" />
        <path d="M10 6h4M10 10h4M10 14h4M10 18h4" />
      </svg>

      <button
        (click)="open = !open"
        class="bg-white border px-4 py-2 rounded-lg shadow flex items-center gap-2 w-40 justify-between">
        {{ selectedTemple }}
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2"
             viewBox="0 0 24 24">
          <path d="M6 9l6 6 6-6" />
        </svg>
      </button>

      <div *ngIf="open"
           class="absolute right-0 top-12 w-40 bg-white rounded-xl shadow-lg z-50">
        <div *ngFor="let t of temples"
             (click)="selectTemple(t)"
             class="px-4 py-2 hover:bg-orange-50 cursor-pointer flex justify-between">
          {{ t }}
          <span *ngIf="t === selectedTemple">✓</span>
        </div>
      </div>
    </div>

  </div>
</div>

    <!-- PAGE CONTENT (CENTERED LIKE FIGMA) -->
    <main class="flex-1 overflow-y-auto">
      <div class="max-w-7xl mx-auto px-6 py-8">
        <router-outlet></router-outlet>
      </div>
    </main>

  </div>
</div>
