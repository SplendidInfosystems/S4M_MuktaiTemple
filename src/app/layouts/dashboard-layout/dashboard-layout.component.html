<div class="flex h-screen bg-gray-50 overflow-hidden">

  <!-- ADMIN SIDEBAR -->
  <app-sidebar
    *ngIf="role === 'admin'"
    [sidebarOpen]="sidebarOpen"
    [screenIsSmall]="screenIsSmall"
    (close)="closeSidebar()">
  </app-sidebar>

  <!-- PRESIDENT SIDEBAR -->
  <app-president-sidebar
    *ngIf="role === 'president'"
    [sidebarOpen]="sidebarOpen"
    [screenIsSmall]="screenIsSmall"
    (close)="closeSidebar()">
  </app-president-sidebar>

  <!-- MAIN AREA -->
  <div class="flex-1 flex flex-col overflow-hidden">

    <!-- 🔥 MOBILE HEADER -->
    <div class="md:hidden bg-white border-b px-4 py-3 flex items-center justify-between">
      <button
        class="text-orange-600 text-2xl"
        (click)="toggleSidebar()">
        ☰
      </button>

      <h1 class="font-semibold text-lg">
        {{ role === 'admin' ? 'Admin Dashboard' : 'President Dashboard' }}
      </h1>
    </div>

    <!-- DESKTOP HEADER -->
    <div *ngIf="role === 'admin'" class="hidden md:block bg-white border-b">
      <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">

        <h1 class="text-3xl font-bold text-orange-600">
          Admin Dashboard
        </h1>

        <!-- Temple Dropdown -->
        <div class="relative flex items-center gap-2">

          <button
            (click)="open = !open"
            class="bg-white border px-4 py-2 rounded-lg shadow flex items-center gap-2 w-40 justify-between">
            {{ selectedTemple }}
            ▼
          </button>

          <div *ngIf="open"
               class="absolute right-0 top-12 w-40 bg-white rounded-xl shadow-lg z-50">
            <div *ngFor="let t of temples"
                 (click)="selectTemple(t)"
                 class="px-4 py-2 hover:bg-orange-50 cursor-pointer flex justify-between">
              {{ t }}
              <span *ngIf="t === selectedTemple">✓</span>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- PAGE CONTENT -->
    <main class="flex-1 overflow-y-auto">
      <div class="max-w-7xl mx-auto px-6 py-8">
        <router-outlet></router-outlet>
      </div>
    </main>

  </div>
</div>
