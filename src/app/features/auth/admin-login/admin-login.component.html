<div class="min-h-screen bg-[#FFF6ED] flex items-center justify-center px-4">

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="w-full max-w-md bg-white rounded-2xl border border-orange-200
           shadow-lg p-8 text-center">

        <!-- Icon -->
        <div class="flex justify-center mb-4">
            <div
                class="w-16 h-16 rounded-full bg-gradient-to-br from-[#FF6B35] to-[#E85A24] flex items-center justify-center text-white">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-user w-8 h-8 text-white"
                    data-fg-djkv33="20.12:20.6251:/src/app/components/LoginPage.tsx:94:13:4124:39:e:User::::::0ls">
                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
            </div>
        </div>

        <!-- Title -->
        <h2 class="text-2xl font-semibold text-orange-600 mb-6">
            Admin Login
        </h2>

        <!-- Username -->
        <div class="mb-4 text-left">
            <label class="block text-sm font-medium mb-1">Email</label>
            <div class="relative">
                <!-- Icon -->
                <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                </span>

                <!-- Input -->
                <input type="text" formControlName="email" placeholder="email" class="w-full pl-10 pr-4 py-2 rounded-lg border
           border-gray-300 focus:ring-1 focus:ring-orange-400 focus:outline-none" 
            [ngClass]="{ 'border-red-500 focus:ring-red-500 focus:border-red-500': loginForm.get('email')?.invalid && (loginForm.get('email')?.touched || submitted)
         }"/>
            </div>

            <p *ngIf="
    loginForm.controls['email'].invalid &&
    (loginForm.controls['email'].touched || submitted)
  " class="text-red-500 text-xs mt-1">
                email is required
            </p>
        </div>

        <!-- Password -->
        <div class="mb-6 text-left">
            <div>
                <label for="password" class="block text-xs font-medium text-gray-900">Password</label>
                <div class="relative">
                    <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
                        <circle cx="12" cy="7" r="4" />
                    </svg>
                </span>
                    <input [type]="showPassword ? 'text' : 'password'" id="password" formControlName="password"
                        placeholder="Enter your password"
                        class="w-full pl-10 pr-4 py-2 rounded-lg border
           border-gray-300 focus:ring-2 focus:ring-orange-400 focus:outline-none"
                        [ngClass]="{
                                     'border-red-500 focus:ring-red-500 focus:border-red-500': loginForm.get('password')?.invalid && (loginForm.get('password')?.touched || submitted)
                                 }" />
                    <button type="button" (click)="togglePasswordVisibility()"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-blue-600">
                        {{ showPassword ? 'Hide' : 'Show' }}
                    </button>
                </div>

                <!-- Error Message -->
                <div *ngIf="loginForm.get('password')?.invalid && (loginForm.get('password')?.touched || submitted)"
                    class="text-xs text-red-500 mt-1">
                    Password is required and must meet the rules
                </div>
            </div>


            <!-- Password Rules -->
            <ul class="text-red-500 font-bold text-xs space-y-0.5 mt-1">
                <li [class.text-green-600]="hasUpperCase()">• At least one uppercase letter</li>
                <li [class.text-green-600]="hasLowerCase()">• At least one lowercase letter</li>
                <li [class.text-green-600]="hasNumber()">• At least one number</li>
                <li [class.text-green-600]="hasSpecialChar()">• At least one special character</li>
                <li [class.text-green-600]="hasMinLength()">• Minimum 6 characters</li>
            </ul>

        </div>

        <!-- Login Button -->
        <button type="submit" class="w-full py-2 rounded-lg bg-orange-500 text-white
             font-medium hover:bg-orange-600 transition mb-3">
            Login
        </button>

        <!-- Go Back -->
        <button type="button" (click)="goBack()" class="w-full py-2 rounded-lg border border-gray-300
             text-gray-700 hover:bg-gray-100 transition">
            Go Back
        </button>
        <p *ngIf="errorMessage" class="text-red-500 text-sm mt-3">
            {{ errorMessage }}
        </p>
    </form>
</div>
