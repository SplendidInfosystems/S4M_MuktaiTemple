<div class="p-6">

  <h2 class="text-2xl font-semibold text-orange-600 mb-4">
    Donation Receipt
  </h2>

  <div *ngIf="pdfUrl; else noReceipt">
    <iframe
      [src]="pdfUrl"
      width="100%"
      height="600px"
      style="border: none;">
    </iframe>
  </div>

  <ng-template #noReceipt>
    <p class="text-gray-500">
      No receipt data found. Please go back and select a donor.
    </p>
  </ng-template>

</div>
