<!-- OVERLAY (MOBILE) -->
<div *ngIf="sidebarOpen && screenIsSmall" class="fixed inset-0 bg-black/40 z-40 md:hidden" (click)="closeSidebar()">
</div>

<!-- SIDEBAR -->
<aside class="fixed md:static top-0 left-0 z-50 h-screen w-64
         bg-gradient-to-b from-[#FF6B35] to-[#E85A24]
         text-white flex flex-col justify-between p-6
         transition-transform duration-300" [class.-translate-x-full]="screenIsSmall && !sidebarOpen">

    <!-- LOGO -->
    <div>
        <div class="flex flex-col items-center py-8">
            <div class="w-16 h-16 bg-white/20 rounded-full flex items-center justify-center text-3xl">ॐ</div>
            <h2 class="mt-3 text-lg font-semibold">Admin</h2>
            <p class="text-sm opacity-80">Dashboard</p>
        </div>

        <!-- MENU -->
        <nav class="px-4 space-y-2">

            <!-- OVERVIEW -->
            <a routerLink="/dashboard/expenses" (click)="closeSidebar()"
                class="flex items-center gap-3 px-4 py-3 rounded-xl text-white cursor-pointer text-white hover:bg-white/20 hover:text-white active:bg-white active:text-orange-600 transition-all duration-200">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-layout-dashboard w-5 h-5"
                    data-fg-easa14="20.7:20.15459:/src/app/components/AdminDashboard.tsx:152:15:5320:33:e:item.icon">
                    <rect width="7" height="9" x="3" y="3" rx="1"></rect>
                    <rect width="7" height="5" x="14" y="3" rx="1"></rect>
                    <rect width="7" height="9" x="14" y="12" rx="1"></rect>
                    <rect width="7" height="5" x="3" y="16" rx="1"></rect>
                </svg> Expenses </a>

            <!-- DONATIONS -->
            <a routerLink="/dashboard/donation" routerLinkActive="bg-white text-orange-600" (click)="closeSidebar()"
                class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/20 transition">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-dollar-sign w-5 h-5"
                    data-fg-easa14="20.7:20.15459:/src/app/components/AdminDashboard.tsx:152:15:5320:33:e:item.icon">
                    <line x1="12" x2="12" y1="2" y2="22"></line>
                    <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path>
                </svg>
                Donations
            </a>

            <!-- RECEIPTS -->
            <a routerLink="/dashboard/receipts" routerLinkActive="bg-white text-orange-600" (click)="closeSidebar()"
                class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/20 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2" />
                </svg>
                Receipts
            </a>

            <!-- EXPENSES -->
            <a routerLink="/dashboard/expenses" routerLinkActive="bg-white text-orange-600" (click)="closeSidebar()"
                class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-white/20 transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" />
                </svg>
                Expenses
            </a>

        </nav>
    </div>

    <!-- LOGOUT -->
    <button class="w-full px-4 py-3 rounded-xl hover:bg-white/20 transition">
        Logout
    </button>

</aside>
