<!-- Donation Records Header -->
<div class="flex justify-between items-center mb-6">
  <h2 class="text-2xl font-semibold text-orange-600">
    Donation Records
  </h2>

  <button
    class="flex items-center gap-2 bg-orange-500 hover:bg-orange-600
           text-white px-4 py-2 rounded-lg shadow transition">
    <span class="text-lg leading-none">+</span>
    Add Donation
  </button>
</div>
<!-- Card Wrapper -->
<div class="bg-white rounded-2xl shadow-sm border border-orange-100 p-4">

  <!-- Table Header -->
  <div
    class="grid grid-cols-[2fr_1.2fr_1fr_1fr_0.8fr]
           text-sm font-semibold text-gray-500 pb-2 border-b">
    <div>Name</div>
    <div>Amount</div>
    <div>Mode</div>
    <div>Date</div>
    <div class="text-right">Actions</div>
  </div>

  <!-- Rows -->
  <div *ngFor="let d of donations"
       class="grid grid-cols-[2fr_1.2fr_1fr_1fr_0.8fr]
              items-center py-3 border-b last:border-b-0 text-sm hover:bg-gray-50">

    <div class="font-medium text-gray-800">
      {{ d.name }}
    </div>

    <div class="font-semibold text-gray-900">
      ₹{{ d.amount }}
    </div>

    <div>
      <span
        class="px-3 py-1 rounded-full text-xs font-medium"
        [ngClass]="d.mode === 'Online'
          ? 'bg-orange-500 text-white'
          : 'bg-gray-100 text-gray-700'">
        {{ d.mode }}
      </span>
    </div>

    <div class="text-gray-600">
      {{ d.date }}
    </div>

    <div class="text-right">
      <button
        class="border border-gray-300 rounded-md px-3 py-1
               hover:bg-gray-50 text-sm">
        Receipt
      </button>
    </div>

  </div>

</div>
