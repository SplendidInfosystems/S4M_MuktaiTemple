<div class="bg-white rounded-2xl border border-orange-200 shadow-sm p-6 mb-8">

  <!-- Header -->
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-lg font-semibold text-orange-600">
      {{ 'ADD_EXPENSE' | translate }}
    </h2>
    <button class="text-gray-400 hover:text-red-500 text-xl">&times;</button>
  </div>

  <form [formGroup]="expenseForm"
        (ngSubmit)="onSubmit()"
        class="grid grid-cols-1 md:grid-cols-2 gap-6">

    <!-- Expense Title -->
    <div>
      <label class="block text-sm font-medium text-gray-600 mb-1">
        {{ 'EXPENSE_TITLE' | translate }} *
      </label>
      <input
        type="text"
        formControlName="category"
        class="w-full rounded-xl px-4 py-2 border outline-none transition"
      />
      <p *ngIf="expenseForm.get('category')?.touched && expenseForm.get('category')?.hasError('required')"
         class="text-red-500 text-sm mt-1">
        {{ 'EXPENSE_TITLE_REQUIRED' | translate }}
      </p>
    </div>

    <!-- Expense Date -->
    <div>
      <label class="block text-sm font-medium text-gray-600 mb-1">
        {{ 'EXPENSE_DATE' | translate }} *
      </label>
      <input
        type="date"
        formControlName="expense_date"
        class="w-full rounded-xl px-4 py-2 border outline-none transition"
      />
      <p *ngIf="expenseForm.get('expense_date')?.touched && expenseForm.get('expense_date')?.hasError('required')"
         class="text-red-500 text-sm mt-1">
        {{ 'EXPENSE_DATE_REQUIRED' | translate }}
      </p>
    </div>

    <!-- Status -->
    <!-- <div>
      <label class="block text-sm font-medium text-gray-600 mb-1">
        {{ 'EXPENSE_STATUS' | translate }} *
      </label>
      <select
        formControlName="status"
        class="w-full rounded-xl px-4 py-2 border outline-none transition">
        <option value="">{{ 'SELECT_STATUS' | translate }}</option>
        <option value="Pending">{{ 'PENDING' | translate }}</option>
        <option value="Paid">{{ 'PAID' | translate }}</option>
        <option value="Unpaid">{{ 'UNPAID' | translate }}</option>
      </select>
      <p *ngIf="expenseForm.get('status')?.touched && expenseForm.get('status')?.hasError('required')"
         class="text-red-500 text-sm mt-1">
        {{ 'EXPENSE_STATUS_REQUIRED' | translate }}
      </p>
    </div> -->

    <!-- Amount -->
    <div>
      <label class="block text-sm font-medium text-gray-600 mb-1">
        {{ 'EXPENSE_AMOUNT' | translate }} *
      </label>
      <input
        type="number"
        formControlName="amount"
        class="w-full rounded-xl px-4 py-2 border outline-none transition"
      />

      <p *ngIf="expenseForm.get('amount')?.touched && expenseForm.get('amount')?.hasError('required')"
         class="text-red-500 text-sm mt-1">
        {{ 'EXPENSE_AMOUNT_REQUIRED' | translate }}
      </p>

      <p *ngIf="expenseForm.get('amount')?.touched && expenseForm.get('amount')?.hasError('min')"
         class="text-red-500 text-sm mt-1">
        {{ 'EXPENSE_AMOUNT_INVALID' | translate }}
      </p>

      <p *ngIf="convertedAmountInWords"
         class="text-xs text-gray-600 italic mt-1">
        {{ convertedAmountInWords }}
      </p>
    </div>

    <!-- Description -->
    <div>
      <label class="block text-sm font-medium text-gray-600 mb-1">
        {{ 'EXPENSE_DESCRIPTION' | translate }} *
      </label>
      <input
        type="text"
        formControlName="description"
        class="w-full rounded-xl px-4 py-2 border outline-none transition"
      />
      <p *ngIf="expenseForm.get('description')?.touched && expenseForm.get('description')?.hasError('required')"
         class="text-red-500 text-sm mt-1">
        {{ 'EXPENSE_DESCRIPTION_REQUIRED' | translate }}
      </p>
    </div>

    <!-- Buttons -->
    <div class="flex justify-end gap-3 md:col-span-2">
      <button
        type="button"
        (click)="onCancel()"
        class="px-5 py-2 rounded-xl border border-gray-300 text-gray-600 hover:bg-gray-100">
        {{ 'CANCEL' | translate }}
      </button>

      <button
        type="submit"
        [disabled]="expenseForm.invalid || isSubmitting"
        class="px-6 py-2 rounded-xl bg-orange-500 text-white hover:bg-orange-600 disabled:opacity-50">
        {{ isSubmitting ? ('SUBMITTING' | translate) : ('SUBMIT_EXPENSE' | translate) }}
      </button>
    </div>

  </form>
</div>
