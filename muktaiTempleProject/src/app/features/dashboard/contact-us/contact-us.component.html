<div class="max-w-6xl mx-auto mt-10 px-6 overflow-y-auto">
  <div class="bg-white shadow-lg rounded-lg p-6">
    <h2 class="text-2xl font-semibold text-left text-cyan-700 mb-6">
      {{ 'CONTACT_US' | translate }}
    </h2>

    <!-- Form & Address Section -->
    <div class="grid md:grid-cols-2 gap-6">
      <!-- Contact Form -->
      <form [formGroup]="contactForm" (ngSubmit)="onSubmit()" class="space-y-4">
        <!-- Name -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            {{ 'CONTACT_US_NAME' | translate }} <span class="text-red-500">*</span>
          </label>
          <input
            type="text"
            formControlName="name"
            [placeholder]="'CONTACT_US_ENTER_NAME' | translate"
            class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 transition-all"
            [ngClass]="{
              'border-red-500 focus:ring-red-500': contactForm.get('name')?.touched && contactForm.get('name')?.invalid,
              'border-blue-500 focus:ring-blue-500': contactForm.get('name')?.touched && contactForm.get('name')?.valid,
              'border-gray-300': !contactForm.get('name')?.touched
            }"
          />
          <small
            *ngIf="contactForm.get('name')?.touched && contactForm.get('name')?.invalid"
            class="text-red-500"
          >
            {{ 'CONTACT_US_NAME_REQUIRED' | translate }}
          </small>
        </div>

        <!-- Email -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            {{ 'CONTACT_US_EMAIL' | translate }} <span class="text-red-500">*</span>
          </label>
          <input
            type="email"
            formControlName="email"
            [placeholder]="'CONTACT_US_ENTER_EMAIL' | translate"
            class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 transition-all"
            [ngClass]="{
              'border-red-500 focus:ring-red-500': contactForm.get('email')?.touched && contactForm.get('email')?.invalid,
              'border-blue-500 focus:ring-blue-500': contactForm.get('email')?.touched && contactForm.get('email')?.valid,
              'border-gray-300': !contactForm.get('email')?.touched
            }"
          />
          <small
            *ngIf="contactForm.get('email')?.touched && contactForm.get('email')?.invalid"
            class="text-red-500"
          >
            {{ 'CONTACT_US_EMAIL_REQUIRED' | translate }}
          </small>
        </div>

        <!-- Mobile No -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            {{ 'CONTACT_US_MOBILE_NO' | translate }} <span class="text-red-500">*</span>
          </label>
          <input
            type="tel"
            formControlName="mobileNo"
            [placeholder]="'CONTACT_US_ENTER_MOBILE_NO' | translate"
            class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 transition-all"
            [ngClass]="{
              'border-red-500 focus:ring-red-500': contactForm.get('mobileNo')?.touched && contactForm.get('mobileNo')?.invalid,
              'border-blue-500 focus:ring-blue-500': contactForm.get('mobileNo')?.touched && contactForm.get('mobileNo')?.valid,
              'border-gray-300': !contactForm.get('mobileNo')?.touched
            }"
          />
          <small
            *ngIf="contactForm.get('mobileNo')?.touched && contactForm.get('mobileNo')?.invalid"
            class="text-red-500"
          >
            {{ 'CONTACT_US_MOBILE_REQUIRED' | translate }}
          </small>
        </div>

        <!-- Message -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            {{ 'CONTACT_US_MESSAGE' | translate }} <span class="text-red-500">*</span>
          </label>
          <textarea
            rows="4"
            formControlName="message"
            [placeholder]="'CONTACT_US_ENTER_MESSAGE' | translate"
            class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 transition-all"
            [ngClass]="{
              'border-red-500 focus:ring-red-500': contactForm.get('message')?.touched && contactForm.get('message')?.invalid,
              'border-blue-500 focus:ring-blue-500': contactForm.get('message')?.touched && contactForm.get('message')?.valid,
              'border-gray-300': !contactForm.get('message')?.touched
            }"
          ></textarea>
          <small
            *ngIf="contactForm.get('message')?.touched && contactForm.get('message')?.invalid"
            class="text-red-500"
          >
            {{ 'CONTACT_US_MESSAGE_REQUIRED' | translate }}
          </small>
        </div>

        <!-- Submit -->
        <button
          type="submit"
          class="bg-emerald-500 hover:bg-emerald-600 text-white font-semibold px-6 py-2 rounded w-full"
        >
          {{ 'CONTACT_US_SEND_MESSAGE' | translate }}
        </button>
      </form>

      <!-- Contact Info Buttons -->
      <div class="space-y-4 mt-4">
        <button class="contact-button">
          <i class="fas fa-map-marker-alt text-red-500 mr-3"></i>
          {{ 'CONTACT_US_OFFICE_ADDRESS' | translate }}
        </button>

        <button class="contact-button">
          <i class="fas fa-envelope text-red-500 mr-3"></i>
          {{ 'CONTACT_US_MAIL_ADDRESS' | translate }}
        </button>

        <button class="contact-button">
          <i class="fas fa-phone text-red-500 mr-3"></i>
          {{ 'CONTACT_US_TELEPHONE_NO' | translate }}
        </button>
      </div>
    </div>

    <!-- Map Section -->
    <div class="mt-6">
      <div class="flex items-center justify-between mb-2">
        <h3 class="text-sm font-semibold text-gray-700">
          {{ 'CONTACT_US_TRACK_NEARBY' | translate }}
        </h3>
        <i class="fas fa-map-marker-alt text-gray-500 text-sm"></i>
      </div>
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3770.981088925477!2d73.835598!3d18.512578!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bc2c10d8f4311f5%3A0x3e2c14c5c43e31f6!2sMuktainagar!5e0!3m2!1sen!2sin!4v1620000000000!5m2!1sen!2sin"
        width="100%"
        height="250"
        class="rounded border"
        style="border:0;"
        allowfullscreen=""
        loading="lazy"
      ></iframe>
    </div>
  </div>
</div>
