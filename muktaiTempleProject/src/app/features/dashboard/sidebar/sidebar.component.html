<div
  class="bg-red-500 text-white w-64 min-h-screen fixed md:static transition-transform duration-300 z-50"
  [ngClass]="{
    'translate-x-0': sidebarOpen,
    '-translate-x-full': !sidebarOpen && screenIsSmall
  }"
>
  <div class="p-4 font-bold text-xl">📊 Dashboard</div>
  <nav class="flex flex-col gap-4 p-4">
    <a routerLink="/dashboard/home" class="hover:bg-red-600 p-2 rounded">🏠 Home</a>
    <a routerLink="/dashboard/about" class="hover:bg-red-600 p-2 rounded">❓ About Us</a>
    <a routerLink="/dashboard/donation" class="hover:bg-red-600 p-2 rounded">💰 Donation</a>
    <a routerLink="/dashboard/expenses" class="hover:bg-red-600 p-2 rounded">📊 Expenses</a>
    <a routerLink="/dashboard/contact" class="hover:bg-red-600 p-2 rounded">📩 Contact Us</a>
  </nav>
</div>
