<div class="w-full max-w-xl mx-auto mt-10 bg-white rounded shadow-md">
  <!-- Form Header -->
  <div class="bg-orange-500 text-white px-6 py-4 flex justify-between items-center rounded-t">
    <h2 class="text-lg font-semibold">Add Expenses Name</h2>
    <button class="text-white text-xl font-bold">&times;</button>
  </div>

  <!-- Form Body -->
  <form [formGroup]="expenseForm" (ngSubmit)="onSubmit()" class="px-6 py-6 space-y-4">
    <!-- Expense Name -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Expense Name <span class="text-red-500">*</span>
      </label>
      <input
        type="text"
        formControlName="expenseName"
        placeholder="Enter Exp. Name"
        class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 transition-all duration-150"
        [ngClass]="{
          'border-red-500 focus:ring-red-500': expenseForm.get('expenseName')?.touched && expenseForm.get('expenseName')?.invalid,
          'border-blue-500 focus:ring-blue-500': expenseForm.get('expenseName')?.touched && expenseForm.get('expenseName')?.valid,
          'border-gray-300': !expenseForm.get('expenseName')?.touched
        }"
      />
      <small *ngIf="expenseForm.get('expenseName')?.touched && expenseForm.get('expenseName')?.invalid" class="text-red-500">
        Expense Name is required
      </small>
    </div>

    <!-- Date -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Date <span class="text-red-500">*</span>
      </label>
      <input
        type="date"
        formControlName="date"
        class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 transition-all duration-150"
        [ngClass]="{
          'border-red-500 focus:ring-red-500': expenseForm.get('date')?.touched && expenseForm.get('date')?.invalid,
          'border-blue-500 focus:ring-blue-500': expenseForm.get('date')?.touched && expenseForm.get('date')?.valid,
          'border-gray-300': !expenseForm.get('date')?.touched
        }"
      />
      <small *ngIf="expenseForm.get('date')?.touched && expenseForm.get('date')?.invalid" class="text-red-500">
        Date is required
      </small>
    </div>

    <!-- Category -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Category <span class="text-red-500">*</span>
      </label>
      <input
        type="text"
        formControlName="category"
        placeholder="Enter Category"
        class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 transition-all duration-150"
        [ngClass]="{
          'border-red-500 focus:ring-red-500': expenseForm.get('category')?.touched && expenseForm.get('category')?.invalid,
          'border-blue-500 focus:ring-blue-500': expenseForm.get('category')?.touched && expenseForm.get('category')?.valid,
          'border-gray-300': !expenseForm.get('category')?.touched
        }"
      />
      <small *ngIf="expenseForm.get('category')?.touched && expenseForm.get('category')?.invalid" class="text-red-500">
        Category is required
      </small>
    </div>

    <!-- Amount -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Amount <span class="text-red-500">*</span>
      </label>
      <input
        type="number"
        formControlName="amount"
        placeholder="Enter Amount"
        class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 transition-all duration-150"
        [ngClass]="{
          'border-red-500 focus:ring-red-500': expenseForm.get('amount')?.touched && expenseForm.get('amount')?.invalid,
          'border-blue-500 focus:ring-blue-500': expenseForm.get('amount')?.touched && expenseForm.get('amount')?.valid,
          'border-gray-300': !expenseForm.get('amount')?.touched
        }"
      />
      <small *ngIf="expenseForm.get('amount')?.touched && expenseForm.get('amount')?.invalid" class="text-red-500">
        Amount is required and must be greater than 0
      </small>
    </div>

    <!-- Description -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Description <span class="text-red-500">*</span>
      </label>
      <textarea
        rows="3"
        formControlName="description"
        placeholder="Enter Expenses Description"
        class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 transition-all duration-150"
        [ngClass]="{
          'border-red-500 focus:ring-red-500': expenseForm.get('description')?.touched && expenseForm.get('description')?.invalid,
          'border-blue-500 focus:ring-blue-500': expenseForm.get('description')?.touched && expenseForm.get('description')?.valid,
          'border-gray-300': !expenseForm.get('description')?.touched
        }"
      ></textarea>
      <small *ngIf="expenseForm.get('description')?.touched && expenseForm.get('description')?.invalid" class="text-red-500">
        Description is required
      </small>
    </div>

    <!-- States -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        States <span class="text-red-500">*</span>
      </label>
      <input
        type="text"
        formControlName="state"
        placeholder="Enter State"
        class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 transition-all duration-150"
        [ngClass]="{
          'border-red-500 focus:ring-red-500': expenseForm.get('state')?.touched && expenseForm.get('state')?.invalid,
          'border-blue-500 focus:ring-blue-500': expenseForm.get('state')?.touched && expenseForm.get('state')?.valid,
          'border-gray-300': !expenseForm.get('state')?.touched
        }"
      />
      <small *ngIf="expenseForm.get('state')?.touched && expenseForm.get('state')?.invalid" class="text-red-500">
        State is required
      </small>
    </div>

    <!-- Submit Button -->
    <div class="pt-4">
      <button
        type="submit"
        class="w-full bg-orange-500 text-white font-semibold py-2 rounded hover:bg-orange-600 transition duration-200"
      >
        SUBMIT
      </button>
    </div>
  </form>
</div>
