<div class="bg-red-500 text-white px-4 py-3 shadow w-full">
  <div class="flex items-center justify-between">
    <!-- Left: Menu + Label -->
    <div class="flex items-center gap-4">
      <button class="md:hidden text-white text-2xl" (click)="toggle()">
        <i class="fas fa-bars"></i>
      </button>
   
    </div>

    <!-- Center: Search -->
    <div class="hidden md:flex relative w-80">
      <i class="fas fa-search absolute left-3 top-1/2 transform -translate-y-1/2 text-gray-400"></i>
      <input
        type="text"
        placeholder="Search Here"
        class="w-full pl-10 pr-4 py-2 rounded-md border focus:outline-none focus:ring-2 focus:ring-white text-black"
      />
    </div>

    <!-- Right: Icons -->
    <div class="flex items-center gap-4 text-white">
      <i class="fas fa-cog text-lg cursor-pointer"></i>
      <i class="fas fa-bell text-lg cursor-pointer"></i>
      <i class="fas fa-user-circle text-2xl cursor-pointer"></i>
    </div>
  </div>
</div>
