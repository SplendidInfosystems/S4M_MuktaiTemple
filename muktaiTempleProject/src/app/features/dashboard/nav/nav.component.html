<header class="bg-red-500 text-white p-4 flex justify-between items-center shadow-md">
  <!-- Left: Hamburger on small screens -->
  <button class="md:hidden text-white text-2xl" (click)="toggle()">
    <i class="fas fa-bars"></i>
  </button>

  <!-- Center: Title -->
  <h1 class="text-xl font-semibold">Dashboard</h1>

  <!-- Right: Icons -->
  <div class="flex items-center gap-4">
    <i class="fas fa-cog cursor-pointer"></i>
    <i class="fas fa-bell cursor-pointer"></i>
    <i class="fas fa-user-circle text-2xl cursor-pointer"></i>
  </div>
</header>
