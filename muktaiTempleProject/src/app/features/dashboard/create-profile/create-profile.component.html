<div class="w-full max-w-2xl mx-auto mt-10 bg-white rounded-lg shadow-lg">
  
  <!-- Header -->
  <div class="bg-emerald-500 text-white px-6 py-4 rounded-t-lg">
    <h2 class="text-lg font-semibold">{{ 'CREATE_ADMIN' | translate }}</h2>
  </div>

  <!-- Form -->
  <form [formGroup]="adminForm" (ngSubmit)="onSubmit()" class="px-6 py-6 space-y-4">
    
    <!-- Full Name -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        {{ 'FULL_NAME' | translate }} <span class="text-red-500">*</span>
      </label>
      <input
        type="text"
        formControlName="fullName"
        [placeholder]="'ENTER_FULL_NAME' | translate"
        class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 border-gray-300 focus:ring-emerald-500"
      />
    </div>

    <!-- Email -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        {{ 'EMAIL' | translate }} <span class="text-red-500">*</span>
      </label>
      <input
        type="email"
        formControlName="email"
        [placeholder]="'ENTER_EMAIL' | translate"
        class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 border-gray-300 focus:ring-emerald-500"
      />
    </div>

    <!-- Username -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        {{ 'USERNAME' | translate }} <span class="text-red-500">*</span>
      </label>
      <input
        type="text"
        formControlName="username"
        [placeholder]="'ENTER_USERNAME' | translate"
        class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 border-gray-300 focus:ring-emerald-500"
      />
    </div>

    <!-- Password -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        {{ 'PASSWORD' | translate }} <span class="text-red-500">*</span>
      </label>
      <input
        type="password"
        formControlName="password"
        [placeholder]="'ENTER_PASSWORD' | translate"
        class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 border-gray-300 focus:ring-emerald-500"
      />
    </div>

    <!-- Role -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        {{ 'ROLE' | translate }}
      </label>
      <select
        formControlName="role"
        class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 border-gray-300 focus:ring-emerald-500"
      >
        <option value="">{{ 'SELECT_ROLE' | translate }}</option>
        <option value="SuperAdmin">{{ 'SUPER_ADMIN' | translate }}</option>
        <option value="Admin">{{ 'ADMIN' | translate }}</option>
        <option value="Moderator">{{ 'MODERATOR' | translate }}</option>
      </select>
    </div>

    <!-- Profile Picture -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        {{ 'PROFILE_PICTURE' | translate }}
      </label>
      <input
        type="file"
        formControlName="profilePic"
        accept="image/*"
        class="w-full border rounded px-3 py-2 focus:outline-none focus:ring-2 border-gray-300 focus:ring-emerald-500"
      />
    </div>

    <!-- Submit Button -->
    <div class="pt-4">
      <button
        type="submit"
        class="w-full bg-emerald-500 text-white font-semibold py-2 rounded hover:bg-emerald-600 transition"
      >
        {{ 'CREATE_ADMIN' | translate }}
      </button>
    </div>

  </form>
</div>
