<div class="w-full max-w-xl mx-auto mt-10 bg-white rounded shadow-md max-h-[90vh] flex flex-col">
  <!-- Header -->
  <div class="bg-cyan-700 text-white px-6 py-4 flex justify-between items-center rounded-t">
    <h2 class="text-lg font-semibold">Add Donors</h2>
    <button class="text-white text-xl font-bold">&times;</button>
  </div>

  <!-- Scrollable only when needed -->
  <form class="px-6 py-6 space-y-4 overflow-y-auto flex-1">
    <!-- Your input fields below -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Donor Name <span class="text-red-500">*</span>
      </label>
      <input type="text" placeholder="Enter donor name"
        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-cyan-500" />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Date <span class="text-red-500">*</span>
      </label>
      <input type="date"
        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-cyan-500" />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Address <span class="text-red-500">*</span>
      </label>
      <input type="text" placeholder="Enter address"
        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-cyan-500" />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Mobile No <span class="text-red-500">*</span>
      </label>
      <input type="tel" placeholder="Enter mobile no"
        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-cyan-500" />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Donation Amount <span class="text-red-500">*</span>
      </label>
      <input type="number" placeholder="Enter amount"
        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-cyan-500" />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Payment Method <span class="text-red-500">*</span>
      </label>
      <input type="text" placeholder="Enter payment method"
        class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-cyan-500" />
    </div>

    <div class="pt-4">
      <button type="submit"
        class="w-full bg-cyan-700 hover:bg-cyan-800 text-white font-semibold py-2 rounded">
        SUBMIT
      </button>
    </div>
  </form>
</div>
