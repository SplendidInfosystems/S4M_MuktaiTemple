<div class="flex flex-col lg:flex-row">
  <!-- Main Content -->
  <div class="flex-1 p-4 sm:p-6 md:p-8 bg-gray-100 min-h-screen">
    <div class="bg-white rounded shadow-lg p-4 sm:p-6">
      
      <!-- Header -->
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4">
        <h3 class="text-lg sm:text-xl font-semibold">Expenses</h3>
        <button
          class="bg-emerald-500 text-white px-4 py-2 rounded hover:bg-emerald-600 w-full sm:w-auto"
          (click)="openAddExpenseModal()"
        >
          + Add Expenses
        </button>
      </div>

      <!-- Responsive Table -->
      <div class="overflow-x-auto">
        <table class="min-w-full text-sm text-left border border-gray-300">
          <thead class="bg-gray-100 text-gray-700">
            <tr>
              <th class="px-4 py-2 border">Expenses Name</th>
              <th class="px-4 py-2 border">Expenses Date</th>
              <th class="px-4 py-2 border">Description</th>
              <th class="px-4 py-2 border">Category</th>
              <th class="px-4 py-2 border">Amount</th>
            </tr>
          </thead>
          <tbody>
            <tr class="hover:bg-gray-50">
              <td class="px-4 py-2 border">Travelling exp.</td>
              <td class="px-4 py-2 border">01.01.25</td>
              <td class="px-4 py-2 border">Fixed Asset Purchase</td>
              <td class="px-4 py-2 border">Fixed Asset</td>
              <td class="px-4 py-2 border">₹100</td>
            </tr>
          </tbody>
        </table>
      </div>
      
    </div>
  </div>
</div>
