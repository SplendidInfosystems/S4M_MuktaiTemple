<nav class="bg-red-500 fixed top-0 left-0 w-full z-20 border-b border-gray-200 ">
  <div class="max-w-screen-xl mx-auto flex items-center justify-between px-4 h-16">

    <!-- Left: Logo or title -->

    <!-- Center: Navigation Menu -->

      <svg class="w-6 h-6 text-white cursor-pointer" (click)="logout()" xmlns="http://www.w3.org/2000/svg" fill="none"

        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"

            d="M1 1h15M1 7h15M1 13h15" />

      </button>
