<nav class="bg-[#fa7f1b] fixed top-0 left-0 w-full z-20 border-b border-gray-200">
  <div class="max-w-screen-xl mx-auto flex items-center justify-between px-4 h-16">
    <!-- Left: Logo -->
    <div class="flex items-center h-full">
      <img src="assets/images/muktailogo1.png" class="w-14 h-16 object-contain" alt="Logo">
    </div>

    <!-- Center: Navigation Menu -->
    <div class="hidden md:flex items-center justify-center bg-white border rounded-2xl px-6 py-2.5 shadow gap-8 text-black font-medium">
      <!-- <a (click)="scrollTo('about')" class="hover:text-yellow-300">About Us</a> -->
      <a (click)="scrollTo('templates')" class="hover:text-yellow-300">Temples</a>
      <a (click)="scrollTo('Events')" class="hover:text-yellow-300">Events</a>
      <a (click)="scrollTo('schedule')" class="hover:text-yellow-300">Scheduled</a>
      <a (click)="scrollTo('how-to-rich')" class="hover:text-yellow-300">How To Reach</a>
      <a (click)="scrollTo('contact-us')" class="hover:text-yellow-300">Contact Us</a>
    </div>

    <!-- Right: Icons -->
    <div class="flex items-center space-x-4">
      
  
      <!-- Settings -->
      <i class="fas fa-cog cursor-pointer text-white" (click)="toggleDropdown()"></i>

   

      <!-- Language Dropdown -->
      <div class="relative">
        <div *ngIf="showDropdown" class="absolute right-0 mt-2 w-32 bg-white text-black rounded shadow-md">
          <button class="w-full text-left px-4 py-2 hover:bg-gray-200" (click)="setLanguage('en')">English</button>
          <button class="w-full text-left px-4 py-2 hover:bg-gray-200" (click)="setLanguage('mr')">Marathi</button>
        </div>
      </div>

         <!-- Logout (only if logged in) -->
      <svg *ngIf="isLoggedIn" class="w-6 h-6 text-white cursor-pointer" (click)="logout()" xmlns="http://www.w3.org/2000/svg"
        fill="none" viewBox="0 0 18 16">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M1 8h11m0 0L8 4m4 4-4 4m4-11h3a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-3" />
      </svg>

          <!-- Login (only if not logged in) -->
 <a *ngIf="!isLoggedIn"
   (click)="login()"
   class="border border-white cursor-pointer text-white hover:bg-orange-500 transition-colors duration-200 px-3 py-1.5 rounded-md text-sm font-medium">
  Login
</a>

      <!-- Mobile Menu Toggle -->
      <button (click)="toggleMobileMenu()"
        class="md:hidden p-2 w-9 h-9 justify-center text-sm text-white rounded hover:bg-orange-500 focus:outline-none">
        <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 17 14">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M1 1h15M1 7h15M1 13h15" />
        </svg>
      </button>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div *ngIf="isMobileMenuOpen" class="md:hidden px-4 pb-4 bg-orange-500">
    <ul class="space-y-2 text-white">
      <li><a (click)="scrollTo('about')" class="hover:text-yellow-300 block py-1">About Us</a></li>
      <li><a (click)="scrollTo('templates')" class="hover:text-yellow-300">Temples</a></li>
      <li><a (click)="scrollTo('Events')" class="hover:text-yellow-300">Events</a></li>
      <li><a (click)="scrollTo('schedule')" class="hover:text-yellow-300">Scheduled</a></li>
      <li><a (click)="scrollTo('how-to-rich')" class="hover:text-yellow-300">How To Reach</a></li>
      <li><a (click)="scrollTo('contact-us')" class="hover:text-yellow-300">Contact Us</a></li>
      <li *ngIf="!isLoggedIn"><a routerLink="/login" class="hover:text-yellow-300">Login</a></li>
    </ul>
  </div>
</nav>
