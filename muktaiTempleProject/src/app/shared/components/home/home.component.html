

<app-header></app-header>


<!-- header section component here -->


<main class="relative pt-[64px] min-h-screen overflow-hidden">

  <!-- Top Half Section with Gradient Background -->
  <div class="bg-gradient-to-t from-[#cc4b00] via-[#f7b570] to-[#f5f5f5] pb-10">
    <div class="relative z-10 flex flex-col md:flex-row items-center md:items-start justify-center md:justify-start max-w-4xl mx-auto px-4 py-10 gap-6">
      <!-- Image Left -->
      <div class="flex-shrink-0 mb-4 md:mb-0 md:mr-6 flex justify-center md:justify-start w-full md:w-auto">
        <img src="assets/images/muktaimage.png"
             alt="Saint Muktabai"
             class="w-40 h-48 object-cover rounded shadow-md" />
      </div>
      <!-- Text Right -->
      <div class="flex-1 text-left w-full">
        <h2 class="text-2xl font-bold mb-2">Saint Muktabai</h2>
        <p class="text-black font-semibold text-base leading-relaxed">
          {{ description.text }}.
        </p>
      </div>
    </div>
  </div>

  <!-- Bottom Half Section with White Background -->
  <div class="bg-white relative z-10 ">
    <div class="max-w-6xl mx-auto px-4">
      <div class="bg-white shadow-lg rounded-xl p-6">
        <h3 class="text-2xl font-bold mb-4">Temples</h3>

        <!-- Card with 3 images in a row -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <!-- Card 1 -->
          <div class="bg-white rounded-xl overflow-hidden shadow border" *ngFor="let temple of temples">
            <img [src]="temple.image"
            class="w-full h-52 object-cover transform transition duration-300 hover:scale-110" />
            <div class="p-3 text-center">
              <h4 class="text-green-700 font-bold">{{ temple.text }}</h4>
            </div>
          </div>

         
        </div>

      </div>
    </div>
  </div>
<div class="max-w-5xl mx-auto p-4">
  <div class="bg-white rounded-xl overflow-hidden shadow border flex flex-col md:flex-row h-auto md:h-80">
    
    <!-- Left Image Section -->
    <div class="md:w-1/3 w-full">
      <img src="assets/images/imagecard1.png" alt="Temple Events"
           class="w-full h-full object-cover transform transition duration-300 hover:scale-110" />
    </div>

    <!-- Right Text Section -->
   
    <!-- Right Text Section -->
    <div class="md:w-1/2 w-full p-4 flex flex-col justify-center">
      <h2 class="text-3xl font-semibold text-gray-800 mb-6">Events</h2>
      <ul class="space-y-4 text-base text-gray-700 leading-relaxed">
        <li>
          <strong class="text-lg">Sant Muktabai Jayanti</strong> (Birth Anniversary)<br/>
          <span class="text-sm text-gray-600">Date (2025): September 22</span>
        </li>
        <li>
          <strong class="text-lg">Sant Muktabai Punyatithi</strong> (Death Anniversary)<br/>
          <span class="text-sm text-gray-600">Date (2025): May 22</span>
        </li>
        <li>
          <strong class="text-lg">Muktai Yatra</strong> (Annual Pilgrimage)<br/>
          <span class="text-sm text-gray-600">Date (2025): February 22–24</span>
        </li>
      </ul>
    </div>

  

  </div>
</div>



</main>
