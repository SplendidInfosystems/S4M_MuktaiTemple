<section class="py-16 bg-gray-50">
  <div class="max-w-7xl mx-auto px-6">
    <h2 class="text-4xl font-extrabold text-center text-red-500 mb-10">
      Temple Image Gallery
    </h2>

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <div
        *ngFor="let img of images"
        class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transform hover:scale-105 transition duration-300"
      >
        <img [src]="img.src" [alt]="img.title" class="w-full h-48 object-cover" />
        <div class="p-4 text-center">
          <h3 class="text-lg font-semibold text-gray-800 mb-1">{{ img.title }}</h3>
          <p class="text-sm text-gray-600">{{ img.desc }}</p>
        </div>
      </div>
    </div>

    <!-- 👇 Button to go back home -->
    <div class="text-center mt-10">
      <button
        routerLink="/home"
        class="bg-orange-500 text-white px-6 py-3 rounded-full font-semibold shadow-md hover:bg-orange-600 hover:shadow-lg transition duration-300"
      >
        Go to Home
      </button>
    </div>

  </div>
</section>
